<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Pedidos | PIZZAS & SABORES</title>
  <link rel="stylesheet" href="./style.css" />
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 20px;
    }
    header {
      background: #800020;
      color: #fff;
      padding: 15px;
    }
    header h2 {
      margin: 0;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 15px;
      padding: 0;
    }
    nav a {
      color: #ffea04;
      text-decoration: none;
      font-weight: bold;
    }
    h1 {
      text-align: center;
      margin-top: 20px;
    }
    table {
      width: 95%;
      margin: 20px auto;
      border-collapse: collapse;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #007BFF;
      color: #fff;
    }
    select {
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h2>PIZZAS & SABORES</h2>
    <nav>
      <ul class="menu">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./dashboard.html">Onboard</a></li>
        <li><a href="./carrinho.html">Carrinho</a></li>
      </ul>
    </nav>
  </header>

  <h1>Painel de Pedidos</h1>
  <table id="tabelaPedidos">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Número</th>
        <th>Pedido</th>
        <th>Endereço</th>
        <th>Total</th>
        <th>Status</th>
      </tr>
    </thead>
    <!-- tbody com id correto -->
    <tbody id="lista-pedidos"></tbody>
  </table>

  <!-- Verificação de login -->
  <script>
    if (localStorage.getItem("logado") !== "true") {
      alert("Acesso restrito! Faça login primeiro.");
      window.location.href = "login.html";
    }
  </script>

  <!-- Scripts principais -->
  <script type="module" src="./firebase.js"></script>
  <script type="module" src="./script.js"></script>
</body>
</html>
