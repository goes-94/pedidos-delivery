<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Pedidos</title>
  <style>
    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
      z-index: 1000;
      position: flex;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #007BFF;
      color: #fff;
    }
    button {
      margin: 20px auto;
      display: block;
      padding: 10px 15px;
      background: #28a745;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }

    .tablepedido {
      position: fixed;
      z-index: 1000;

    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Painel de Pedidos</h1>
  <table id="tabelaPedidos">
    <thead id="tablepedido">
      <tr>
        <th id="name">Nome</th>
        <th id="email">Email</th>
        <th id="numero">Número</th>
        <th id="pedido">Pedido</th>
        <th id="endereco">Endereço</th>
        <th id="pedido">Status</th>
      </tr>
    </thead>
    <tbody id="lista-pedidos"></tbody>
