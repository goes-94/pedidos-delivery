      color: #0b0b0b;

      color: #000;
      padding: 12px 20px;
      border: none;
      cursor: pointer;

    .contact-buttons a {
      display: block;

    .phone { background-color: #e74c3c; }

    .social-icons {

      font-size: 20px;

    .dog-image {

    .social-icons {
        text-decoration: none;
        display: flex;
        align-items: center;
        word-spacing: 0%;
    }
    .footer-column social-media:hover{
